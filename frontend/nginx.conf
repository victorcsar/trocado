server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker + variável no proxy_pass: o nginx resolve o nome "backend" a cada
    # requisição. Sem isso ele guarda o IP da subida e dá 502 quando o backend é recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:3000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # SPA: qualquer rota desconhecida cai no index.html (o React Router assume)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e o service worker sempre conferem com o servidor: depois de um deploy,
    # o navegador precisa ver a versão nova (sem mudança, a resposta é um 304 sem corpo)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # JS e CSS do build mudam de nome a cada versão (hash no nome): cache de um ano.
    # Arquivo que não existe é 404, e não o index.html (o navegador tentaria rodar HTML como script).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
